<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Conectar TikTok · Naranjoso</title>
<link rel="icon" href="assets/perfil/perfil_normal.webp">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css?v=9">
<style>
  .caja { max-width: 560px; margin: 60px auto; background: var(--papel); border-radius: 28px; padding: 28px 22px; box-shadow: var(--sombra); text-align: center; }
  .caja img { width: 140px; margin: 0 auto 10px; }
  .codigo { margin: 18px 0; padding: 14px; border-radius: 14px; background: var(--bg-2); font: 600 .95rem/1.4 ui-monospace, Consolas, monospace; word-break: break-all; user-select: all; }
  .caja p { color: var(--tinta-2); font-weight: 600; margin-top: 8px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="caja">
    <img src="assets/sprites/naranjoso/sentado_feliz.webp" alt="">
    <h1 id="t">Conectando con TikTok…</h1>
    <p id="msg"></p>
    <div class="codigo" id="codigo" hidden></div>
    <button class="btn btn-naranja" id="copiar" type="button" hidden>Copiar código</button>
    <p><a href="index.html">Volver a la web</a></p>
  </div>
</main>
<script>
  // Esta página solo muestra el código que TikTok devuelve; no lo envía a ningún lado.
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error");
  const $ = id => document.getElementById(id);
  if (code) {
    $("t").textContent = "¡Listo! Copia este código";
    $("msg").textContent = "Pégalo en la ventana del script obtener_token.py. Caduca en unos minutos.";
    $("codigo").textContent = code; $("codigo").hidden = false; $("copiar").hidden = false;
    $("copiar").onclick = async () => {
      try { await navigator.clipboard.writeText(code); $("copiar").textContent = "¡Copiado!"; }
      catch (e) { $("copiar").textContent = "Selecciónalo y cópialo a mano"; }
    };
    history.replaceState(null, "", location.pathname); // saca el código de la barra de direcciones
  } else {
    $("t").textContent = err ? "TikTok no autorizó la conexión" : "No hay código";
    $("msg").textContent = err ? (q.get("error_description") || err) : "Esta página se usa solo al conectar la web con TikTok.";
  }
</script>
</body>
</html>
